name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://wallet_local:wallet_local_only@127.0.0.1:5432/wallet_test?schema=public
      POSTGRES_USER: wallet_local
      POSTGRES_PASSWORD: wallet_local_only
      POSTGRES_DB: wallet_dev
      POSTGRES_PORT: '5432'
      BETTER_AUTH_SECRET: test-only-secret-that-is-never-valid-in-production
      BETTER_AUTH_URL: http://127.0.0.1:3000
      WEB_ORIGIN: http://127.0.0.1:5173
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.10.0
          runtime: node@24
          cache: true
          save-cache: ${{ github.event_name != 'pull_request' }}
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @my-wallets/e2e exec playwright install --with-deps chromium

      - name: Start PostgreSQL and prepare the test database
        run: |
          pnpm db:wait
          pnpm db:reset:test
          pnpm db:migrate:deploy

      - name: Run workspace CI checks
        run: pnpm ci:workspace
